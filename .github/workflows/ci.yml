name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build:production
        env:
          PUBLIC_PRIVY_MODE: live
          PUBLIC_PRIVY_APP_ID: app_ci_placeholder
          PUBLIC_PRIVY_CLIENT_ID: client_ci_placeholder
          PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
          PUBLIC_CONVEX_SITE_URL: https://ci-placeholder.convex.site
      - run: pnpm audit --prod --audit-level high
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
